# ==============================================================================
# APP DEFINITIONS
# hyprctl clients -j | jq -r '.[] | "\(.class) -> \(.title)"'
# ==============================================================================
APP discord  vesktop                              vesktop
#APP spotify  Spotify                              spotify
APP beeper   Beeper                               beeper
APP todoist  chrome-app.todoist.com__app-Default  fo-launch-webapp https://app.todoist.com/app
APP calendar chrome-calendar.google.com__-Default fo-launch-webapp https://calendar.google.com
APP obsidian obsidian                             obsidian
#APP nvim     org.fo.nvim                     alacritty --class org.fo.nvim -e nvim
#APP cbonsai  cbonsai-term                         alacritty --class cbonsai-term -e cbonsai -i -l
APP zen      zen                                  zen-browser
APP ytmusic  ytmusic                              zen-browser --new-instance --profile /home/l4n1skyy/.config/zen-youtube-music --name ytmusic https://music.youtube.com
#APP pomo     pomoru-term                          /home/l4n1skyy/.local/bin/desktop/pomoru-autostart

# ==============================================================================
# LAYOUT RULES
# GROUP <workspace> <alias>
# SPAWN <workspace> <alias>
# RATIO <workspace> <alias> <directions> <y_percent> <x_percent>
# FOCUS <workspace> <alias>
# START <workspace>   (workspace to switch to when the layout pass finishes)
# ==============================================================================

START 1

# --- WORKSPACE 10: SOCIAL ---
GROUP 10 beeper discord
FOCUS 10 beeper

# --- WORKSPACE 9: PRODUCTIVITY ---
RATIO 9 todoist     l   100%    30%
RATIO 9 calendar    r   100%    70%

# --- WORKSPACE 8: YOUTUBE MUSIC (its own Zen window, class "ytmusic" via --name) ---
SPAWN 8 ytmusic
FOCUS 8 ytmusic

# --- WORKSPACE 2: BROWSER ---
SPAWN 2 zen
FOCUS 2 zen

# --- WORKSPACE 1: NOTES ---
SPAWN 1 obsidian
FOCUS 1 obsidian

### Read more at config document: https://github.com/limine-bootloader/limine/blob/trunk/CONFIG.md
timeout: 10
default_entry: 2
interface_branding: Limine
hash_mismatch_panic: no

# Catppuccin Mocha. Wallpaper = base + the "WELCOME L4N1SKYY" banner (mauve -> lavender, as on
# the Plymouth splash); made by ~/.config/limine/wallpaper.py
# for exactly this resolution, so it is pinned.
interface_resolution: 1920x1200
wallpaper: boot():/limine/l4n1skyy.png
wallpaper_style: centered
backdrop: 1e1e2e
term_margin: 0
term_margin_gradient: 0

# Branding mauve, help keys pink, countdown digit peach
interface_branding_color: cba6f7
interface_help_color: f5c2e7
interface_help_color_bright: fab387

# Terminal colors: the stock Catppuccin Mocha palette (cyan = teal, used for the
# selected entry's comment line)
term_palette: 45475a;f38ba8;a6e3a1;f9e2af;89b4fa;f5c2e7;94e2d5;bac2de
term_palette_bright: 585b70;f38ba8;a6e3a1;f9e2af;89b4fa;f5c2e7;94e2d5;a6adc8

# Text: entries lavender, the selected one inverted (lavender bar, base text).
# The background is fully transparent (TT=ff) so the wallpaper shows through.
term_background: ff1e1e2e
term_foreground: b4befe
term_foreground_bright: cdd6f4
term_background_bright: 313244


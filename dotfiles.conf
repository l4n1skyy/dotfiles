# ==============================================================================
# dotfiles.conf: what the `dotfiles` command copies into this folder
#
#   include <path>            [# description]   file, folder or glob; relative to ~ or absolute
#   include-if <glob> <regex> [# description]   only files whose content matches regex
#   use <part> | <what> [| <needs>]             a row in the README's "what I use" table
#   exclude <pattern>                           rsync pattern skipped everywhere (*.log, nvim/undo/)
#   redact <regex>                              key names whose values become <redacted>
#   set <option> <value>
#
# Folders are copied whole, then trimmed by `exclude`, `skip_stock` and `links`.
# The description after `#` is shown in README.md.
#
# README.md gets one section per `# --- Name ---` header that has `use` or
# `include` lines: a table of what I use, then the configs listed under it.
#   <needs>        packages (pacman or Flatpak) or commands, space-separated; the
#                  row is left out while one is missing, so removed apps drop off
#   {ver:<pkg>}    installed version of <pkg> (row left out if it isn't installed)
#   {theme}        current fuck-omarchy theme      {font}        monospace font
#   {gtk-theme}    GTK theme                       {icon-theme}  icon theme
#   {webapps}      names of the web apps copied here
# ==============================================================================

# --- OPTIONS ------------------------------------------------------------------
set remote      https://github.com/l4n1skyy/dotfiles.git
set branch      master
set skip_stock  yes     # drop files identical to fuck-omarchy's defaults ($FO_PATH/config)
set links       safe    # safe = skip symlinks pointing outside the copied folder; keep = copy all
set max_size    5M      # skip any single file bigger than this
set packages    yes     # write packages/*.txt (explicitly installed packages)

# --- System -------------------------------------------------------------------
use Machine        | Acer Predator Helios Neo 16 (PHN16-72): i5-14500HX, 16 GB RAM
use OS             | Arch Linux
use Kernel         | linux-cachyos-bore {ver:linux-cachyos-bore} (BORE scheduler)
use Bootloader     | Limine: FrAnkEnArch (CachyOS kernel), Windows and the latest snapshot | limine
use Boot splash    | Plymouth with my own logo                                          | plymouth
use Disk           | btrfs on LUKS; snapper + snap-pac take a snapshot on every pacman run | snapper snap-pac
use Swap           | zram, plus a swapfile for hibernation                              | zram-generator
use Packages       | pacman, yay for the AUR, Flatpak; kernel from `[cachyos-v3]`       | yay
use Graphics       | Intel drives the laptop screen, NVIDIA RTX 4060 on nvidia-open     | nvidia-open-dkms
use Audio          | PipeWire + WirePlumber                                             | pipewire wireplumber
use Network        | NetworkManager, ufw firewall                                       | networkmanager ufw
use Power          | power-profiles-daemon, thermald, intel-lpmd                        | power-profiles-daemon

include /etc/boot/hooks/post.d/40-menu-layout      # Limine hook: OS > FrAnkEnArch / Windows menu
include /etc/boot/hooks/post.d/50-snapshot-latest  # Limine hook: one "snapshot-latest" boot entry
include /etc/default/limine                        # Limine settings: boot order, snapshot entries
include /etc/mkinitcpio.conf.d/zz-hybrid-gpu.conf  # Keep nouveau + its firmware out of the kernel images
include /etc/pacman.d/mirrorlist.arch              # Spare copy of the ranked Arch mirrorlist

# --- Desktop ------------------------------------------------------------------
use Window manager | Hyprland {ver:hyprland} (Lua config), started with uwsm
use Desktop shell  | fuck-omarchy, my trimmed fork of Omarchy, on Quickshell: bar, notifications, launcher, menus, OSD, lock screen, idle | quickshell
use Theme          | {theme}; each theme switches colours, wallpaper and icons together
use Font           | {font} everywhere, icons from Nerd Fonts Symbols                   | ttf-nerd-fonts-symbols
use GTK            | {gtk-theme} with {icon-theme} icons
use Login screen   | SDDM with my own Cozette theme                                     | sddm
use Input method   | fcitx5                                                             | fcitx5
use Screenshots    | grim + slurp, annotated in tensaku                                 | grim slurp tensaku
use Recording      | gpu-screen-recorder from the bar, OBS Studio                       | gpu-screen-recorder
use Utilities      | cliphist (clipboard), hyprpicker (colour picker), hyprsunset (night light), kanshi (monitors)

include .config/hypr                     # Hyprland: bindings, look, input, autostart
include .config/fuck-omarchy             # fuck-omarchy: shell.json, hooks, themes, wallpapers (code lives in ~/.local/share/fuck-omarchy)
include .config/uwsm/env                 # Session env: loads fuck-omarchy's FO_PATH + PATH
include .config/kanshi                   # Monitor profiles
include .config/autostart                # XDG autostart overrides
include .config/sddm                     # Login screen theme
include .config/wlogout                  # Logout menu
include .config/fcitx5                   # Input method
include .config/fontconfig               # Font rules
include .config/mimeapps.list            # Default applications
include .config/gtk-3.0/settings.ini     # GTK 3 theme
include .config/gtk-4.0/settings.ini     # GTK 4 theme
include .config/nwg-look                 # GTK settings tool
include .config/xsettingsd               # X settings daemon
include .config/tensaku                  # Screenshot editor


# ==============================================================================
# dotfiles.conf: what the `dotfiles` command copies into this folder
#
#   include <path>            [# description]   file, folder or glob; relative to ~ or absolute
#   include-if <glob> <regex> [# description]   only files whose content matches regex
#   exclude <pattern>                           rsync pattern skipped everywhere (*.log, nvim/undo/)
#   redact <regex>                              key names whose values become <redacted>
#   set <option> <value>
#
# Folders are copied whole, then trimmed by `exclude`, `skip_stock` and `links`.
# The description after `#` is shown in README.md.
# ==============================================================================

# --- OPTIONS ------------------------------------------------------------------
set remote      https://github.com/l4n1skyy/dotfiles.git
set branch      master
set skip_stock  yes     # drop files identical to Omarchy's defaults (/usr/share/omarchy/config)
set links       safe    # safe = skip symlinks pointing outside the copied folder; keep = copy all
set max_size    5M      # skip any single file bigger than this
set packages    yes     # write packages/*.txt (installed packages that aren't Omarchy's)
set tree_depth  5       # depth of the folder tree in README.md

# --- SHELL --------------------------------------------------------------------
include .bashrc                          # Bash: env, PATH, aliases, functions (secrets redacted)
include .bash_profile                    # Login shell
include .config/starship.toml            # Prompt
include .config/git/config               # Git identity and aliases
include .config/mise/config.toml         # mise tool versions

# --- DESKTOP: HYPRLAND + OMARCHY ----------------------------------------------
include .config/hypr                     # Hyprland: bindings, look, input, autostart
include .config/omarchy                  # Omarchy shell.json, plugins, hooks, themes, wallpapers
include .config/kanshi                   # Monitor profiles
include .config/autostart                # XDG autostart overrides
include .config/sddm                     # Login screen theme
include .config/wlogout                  # Logout menu
include .config/fcitx5                   # Input method
include .config/fontconfig               # Font rules
include .config/mimeapps.list            # Default applications
include .config/gtk-3.0/settings.ini     # GTK 3 theme
include .config/gtk-4.0/settings.ini     # GTK 4 theme
include .config/nwg-look                 # GTK settings tool
include .config/xsettingsd               # X settings daemon

# --- TERMINALS & TUI ----------------------------------------------------------
include .config/alacritty                # Alacritty
include .config/ghostty                  # Ghostty
include .config/kitty                    # Kitty
include .config/foot                     # Foot
include .config/tmux                     # tmux
include .config/nvim                     # Neovim (LazyVim)
include .config/btop                     # btop
include .config/fastfetch                # fastfetch
include .config/lazygit                  # lazygit
include .config/herdr                    # herdr
include .config/terminalist              # terminalist
include .config/tensaku                  # tensaku
include .config/cliamp/config.toml       # cliamp

# --- APPS ---------------------------------------------------------------------
include .config/spicetify                # Spotify theming
include .config/pomoru/config.toml       # Pomodoro timer
include .config/aether                   # Aether wallpaper source (API key redacted)
include .config/brave-flags.conf         # Brave flags
include .config/chromium-flags.conf      # Chromium flags
include .config/Code/User/settings.json  # VS Code settings
include .config/Code/User/snippets       # VS Code snippets
include .claude/settings.json            # Claude Code settings

# --- SCRIPTS & LAUNCHERS ------------------------------------------------------
include .local/bin                       # Personal scripts: layout engine, toggles, AI wrappers, this sync script
include .local/share/applications/icons  # Web app icons
include-if .local/share/applications/*.desktop omarchy-launch-webapp|--app=   # Web apps

# --- SYSTEM -------------------------------------------------------------------
include /etc/boot/hooks/post.d/50-snapshot-latest  # Limine hook: one "snapshot-latest" boot entry

# --- PRIVATE: the GitHub repo is PUBLIC, uncomment only if you're OK with that --
# include .config/msmtp                  # Mail sending (email addresses)
# include .config/mutt                   # Mail client (email addresses)
# include .mbsyncrc                      # Mail sync
# include .notmuch-config                # Mail index
# include .XCompose                      # Compose keys (contains your name/email)

# --- EXCLUDES -----------------------------------------------------------------
exclude *.bak
exclude *.bak.*
exclude *.omarchy-upgrade-to-*
exclude *.log
exclude *.pid
exclude *.sock
exclude *.swp
exclude *.sample
exclude .git/
exclude node_modules/
exclude __pycache__/
exclude .DS_Store
exclude nvim/undo/
exclude nvim/spell/
exclude nvim/.netrwhist
exclude spicetify/Backup/
exclude spicetify/Extracted/
exclude spicetify/CustomApps/
exclude pomoru/status.json
exclude fcitx5/conf/cached_layouts

# --- SECRETS ------------------------------------------------------------------
# Values of keys whose name matches get replaced, e.g. `export X_API_KEY="..."`,
# `"apiKey": "..."`, `token = "..."`. Values of matching environment variables
# (your exported keys) are also scrubbed wherever they appear, and well-known
# key formats (sk-…, AIza…, ghp_…, private keys) are always scrubbed.
redact api[_-]?key
redact token
redact secret
redact passw(or)?d

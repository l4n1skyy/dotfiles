# --- EXCLUDES -----------------------------------------------------------------
exclude *.bak
exclude *.bak.*
exclude *.omarchy-upgrade-to-*
exclude *.log
exclude *.pid
exclude *.sock
exclude *.swp
exclude *.sample
exclude .git/
exclude node_modules/
exclude __pycache__/
exclude .DS_Store
exclude nvim/undo/
exclude nvim/spell/
exclude nvim/.netrwhist
exclude spicetify/Backup/
exclude spicetify/Extracted/
exclude spicetify/CustomApps/
exclude pomoru/status.json
exclude fcitx5/conf/cached_layouts

# --- SECRETS ------------------------------------------------------------------
# Values of keys whose name matches get replaced, e.g. `export X_API_KEY="..."`,
# `"apiKey": "..."`, `token = "..."`. Values of matching environment variables
# (your exported keys) are also scrubbed wherever they appear, and well-known
# key formats (sk-…, AIza…, ghp_…, private keys) are always scrubbed.
redact api[_-]?key
redact token
redact secret
redact passw(or)?d

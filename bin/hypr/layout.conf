# ==============================================================================
# APP DEFINITIONS
# hyprctl clients -j | jq -r '.[] | "\(.class) -> \(.title)"'
# ==============================================================================
APP discord  vesktop                              vesktop
#APP spotify  Spotify                              spotify
APP beeper   Beeper                               beeper
APP todoist  chrome-app.todoist.com__app-Default  chromium --app=https://app.todoist.com/app --user-data-dir="/home/l4n1skyy/.config/todoist-app"
APP calendar chrome-calendar.google.com__-Default omarchy-launch-webapp https://calendar.google.com
APP obsidian obsidian                             obsidian
#APP nvim     org.omarchy.nvim                     alacritty --class org.omarchy.nvim -e nvim
#APP cbonsai  cbonsai-term                         alacritty --class cbonsai-term -e cbonsai -i -l
APP zen      zen                                  zen-browser
#APP pomo     pomoru-term                          /home/l4n1skyy/.local/bin/desktop/pomoru-autostart

# ==============================================================================
# LAYOUT RULES
# GROUP <workspace> <alias>
# SPAWN <workspace> <alias>
# RATIO <workspace> <alias> <directions> <y_percent> <x_percent>
# FOCUS <workspace> <alias>
# ==============================================================================

# --- WORKSPACE 10: SOCIAL ---
GROUP 10 beeper discord
FOCUS 10 beeper

# --- WORKSPACE 8: PRODUCTIVITY ---
RATIO 9 todoist     l   100%    30%
RATIO 9 calendar    r   100%    70%
#
# --- WORKSPACE 9: NOTETAKING ---
SPAWN 8 obsidian
FOCUS 8 obsidian

# --- WORKSPACE 1: THE DASHBOARD ---
SPAWN 1 zen
FOCUS 1 zen

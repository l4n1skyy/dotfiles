# Hybrid Intel + NVIDIA laptop (internal screen on the Intel GPU).
#
# The kms hook autodetects every GPU driver, which pulls the never-used nouveau
# driver and ~100 MB of its firmware into the initramfs for the NVIDIA GPU.
# Drop kms and early-load the Intel driver explicitly instead: i915 shows the
# Plymouth / LUKS prompt on the internal screen, and nvidia.conf already
# early-loads nvidia_drm. Sorts last, so it applies after the other drop-ins.
_hooks=()
for _hook in "${HOOKS[@]}"; do
  [[ $_hook == kms ]] || _hooks+=("$_hook")
done
HOOKS=("${_hooks[@]}")
unset _hooks _hook
MODULES=(i915 "${MODULES[@]}")
